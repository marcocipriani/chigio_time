<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Documentazione di prodotto e sviluppo di Chigio Time">
  <title>Chigio Time · Documentazione</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --blue-950: #10264a;
      --blue-800: #174f94;
      --blue-650: #216bc1;
      --blue-100: #eaf3ff;
      --green-600: #13866f;
      --ink: #162033;
      --muted: #657083;
      --line: #dfe5ee;
      --surface: #ffffff;
      --surface-soft: #f6f8fb;
      --canvas: #eef3f8;
      --shadow: 0 16px 48px rgba(17, 42, 82, .10);
      --header-h: 64px;
      --sidebar-w: 284px;
      --toc-w: 220px;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font: 15px/1.65 Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 3px solid rgba(33, 107, 193, .35); outline-offset: 2px; }

    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 30;
      height: var(--header-h);
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(260px, 620px) 1fr;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      color: #fff;
      background: var(--blue-950);
      box-shadow: 0 1px 0 rgba(255,255,255,.12);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 10px;
      color: var(--blue-950);
      background: #fff;
      font-weight: 850;
    }
    .brand-copy { min-width: 0; line-height: 1.15; }
    .brand-copy strong { display: block; letter-spacing: -.01em; }
    .brand-copy span { color: #b8c9df; font-size: 12px; }
    .version {
      justify-self: end;
      padding: 5px 9px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: #dbe9fa;
      font-size: 12px;
    }
    .menu-button {
      display: none;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }
    .search-wrap { position: relative; width: 100%; }
    .search {
      width: 100%;
      height: 40px;
      padding: 0 44px 0 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,.10);
    }
    .search::placeholder { color: #b8c9df; }
    .search-icon { position: absolute; left: 14px; top: 9px; color: #b8c9df; }
    .shortcut {
      position: absolute;
      right: 10px;
      top: 8px;
      padding: 1px 7px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px;
      color: #b8c9df;
      font-size: 12px;
    }
    .search-results {
      position: absolute;
      z-index: 50;
      inset: calc(100% + 8px) 0 auto;
      max-height: min(520px, 70vh);
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .search-results[hidden] { display: none; }
    .result {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      text-align: left;
      background: transparent;
      cursor: pointer;
    }
    .result:hover, .result:focus-visible { background: var(--blue-100); }
    .result strong { display: block; color: var(--ink); }
    .result span {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .sidebar {
      position: fixed;
      z-index: 20;
      inset: var(--header-h) auto 0 0;
      width: var(--sidebar-w);
      overflow-y: auto;
      padding: 20px 16px 32px;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }
    .nav-section + .nav-section { margin-top: 24px; }
    .nav-title {
      margin: 0 10px 6px;
      color: #8a94a5;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .nav-link {
      display: block;
      padding: 7px 10px;
      border-radius: 8px;
      color: #425069;
      text-decoration: none;
    }
    .nav-link:hover { color: var(--blue-800); background: var(--surface-soft); }
    .nav-link.active {
      color: var(--blue-800);
      background: var(--blue-100);
      font-weight: 700;
    }
    .backdrop {
      display: none;
      position: fixed;
      z-index: 15;
      inset: var(--header-h) 0 0;
      border: 0;
      background: rgba(16, 38, 74, .38);
    }

    .page {
      min-height: 100vh;
      padding: calc(var(--header-h) + 40px) calc(var(--toc-w) + 64px) 64px
        calc(var(--sidebar-w) + 48px);
    }
    .article {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 44px 52px 64px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .article:focus { outline: none; }
    .article > :first-child { margin-top: 0; }
    .article h1, .article h2, .article h3, .article h4 {
      line-height: 1.25;
      letter-spacing: -.02em;
      scroll-margin-top: calc(var(--header-h) + 24px);
    }
    .article h1 { margin: 0 0 28px; font-size: clamp(30px, 5vw, 44px); }
    .article h2 {
      margin: 44px 0 14px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 25px;
    }
    .article h3 { margin: 30px 0 10px; font-size: 19px; }
    .article p, .article li { max-width: 75ch; }
    .article a { color: var(--blue-650); text-underline-offset: 3px; }
    .article a:hover { color: var(--blue-950); }
    .article code {
      padding: .14em .38em;
      border-radius: 5px;
      color: #9c2e55;
      background: #f7edf1;
      font: .88em ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .article pre {
      max-width: 100%;
      overflow: auto;
      padding: 18px;
      border-radius: 10px;
      color: #edf5ff;
      background: #12233d;
    }
    .article pre code { padding: 0; color: inherit; background: transparent; }
    .article blockquote {
      margin: 20px 0;
      padding: 12px 16px;
      border-left: 3px solid var(--blue-650);
      color: #4d5b70;
      background: var(--blue-100);
    }
    .table-wrap { max-width: 100%; overflow-x: auto; margin: 20px 0; }
    .article table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .article th, .article td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .article th { color: var(--blue-950); background: var(--surface-soft); }
    .article img { max-width: 100%; height: auto; border-radius: 10px; }
    .mermaid { overflow-x: auto; padding: 12px 0; text-align: center; }
    .status {
      display: grid;
      min-height: 240px;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    .toc {
      position: fixed;
      z-index: 5;
      inset: calc(var(--header-h) + 40px) 24px auto auto;
      width: var(--toc-w);
      max-height: calc(100vh - var(--header-h) - 72px);
      overflow: auto;
    }
    .toc h2 {
      margin: 0 0 8px;
      color: #8a94a5;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .toc button {
      display: block;
      width: 100%;
      padding: 5px 0;
      border: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      cursor: pointer;
    }
    .toc button:hover { color: var(--blue-650); }
    .toc .level-3 { padding-left: 12px; font-size: 13px; }

    @media (max-width: 1180px) {
      .page { padding-right: 40px; }
      .toc { display: none; }
    }
    @media (max-width: 800px) {
      :root { --header-h: 60px; }
      .topbar {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 10px;
        padding: 0 12px;
      }
      .menu-button { display: grid; }
      .brand, .version, .shortcut { display: none; }
      .search { height: 42px; }
      .sidebar {
        width: min(88vw, 320px);
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: var(--shadow);
      }
      body.menu-open .sidebar { transform: translateX(0); }
      body.menu-open .backdrop { display: block; }
      .page { padding: calc(var(--header-h) + 16px) 12px 32px; }
      .article { padding: 28px 20px 44px; border-radius: 12px; }
      .article h2 { margin-top: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
    @media print {
      .topbar, .sidebar, .toc, .backdrop { display: none !important; }
      .page { padding: 0; }
      .article { width: 100%; padding: 0; border: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="menu-button" id="menuButton" type="button"
      aria-label="Apri navigazione" aria-expanded="false">☰</button>
    <div class="brand" aria-label="Chigio Time">
      <span class="brand-mark">CT</span>
      <span class="brand-copy"><strong>Chigio Time</strong><span>Documentazione</span></span>
    </div>
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input class="search" id="search" type="search"
        placeholder="Cerca nella documentazione…" autocomplete="off"
        aria-label="Cerca nella documentazione" aria-controls="searchResults">
      <span class="shortcut" aria-hidden="true">/</span>
      <div class="search-results" id="searchResults" role="listbox" hidden></div>
    </div>
    <span class="version" id="version"></span>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Navigazione documentazione"></aside>
  <button class="backdrop" id="backdrop" type="button" aria-label="Chiudi navigazione"></button>
  <main class="page">
    <article class="article" id="article" tabindex="-1">
      <div class="status">Caricamento documentazione…</div>
    </article>
  </main>
  <nav class="toc" id="toc" aria-label="In questa pagina"></nav>

  <script>
    const state = {
      manifest: null,
      pages: [],
      currentPath: "",
      searchIndex: new Map()
    };

    const article = document.getElementById("article");
    const sidebar = document.getElementById("sidebar");
    const toc = document.getElementById("toc");
    const search = document.getElementById("search");
    const searchResults = document.getElementById("searchResults");
    const menuButton = document.getElementById("menuButton");

    const escapeHtml = (value) => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const normalizeText = (value) => value
      .toLocaleLowerCase("it")
      .normalize("NFD")
      .replace(/\p{Diacritic}/gu, "");

    const routePath = () => {
      const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
      return state.pages.some((page) => page.path === raw) ? raw : "README.md";
    };

    function closeMenu() {
      document.body.classList.remove("menu-open");
      menuButton.setAttribute("aria-expanded", "false");
    }

    function renderNavigation() {
      sidebar.innerHTML = state.manifest.sections.map((section) => `
        <section class="nav-section">
          <h2 class="nav-title">${escapeHtml(section.title)}</h2>
          ${section.items.map((item) => `
            <a class="nav-link" href="#/${encodeURI(item.path)}"
              data-path="${escapeHtml(item.path)}">${escapeHtml(item.title)}</a>
          `).join("")}
        </section>
      `).join("");
      sidebar.addEventListener("click", closeMenu);
      document.getElementById("version").textContent =
        `v${state.manifest.product.version}`;
    }

    function setActiveNavigation(path) {
      sidebar.querySelectorAll(".nav-link").forEach((link) => {
        const active = link.dataset.path === path;
        link.classList.toggle("active", active);
        if (active) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
    }

    function slugify(value, used) {
      const base = normalizeText(value)
        .replace(/[^a-z0-9\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-") || "sezione";
      let slug = base;
      let suffix = 2;
      while (used.has(slug)) slug = `${base}-${suffix++}`;
      used.add(slug);
      return slug;
    }

    function enhanceArticle(path) {
      const used = new Set();
      const headings = [...article.querySelectorAll("h2, h3")];
      headings.forEach((heading) => {
        heading.id = slugify(heading.textContent, used);
      });

      article.querySelectorAll("table").forEach((table) => {
        const wrapper = document.createElement("div");
        wrapper.className = "table-wrap";
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });

      const currentUrl = new URL(path, location.href);
      const docsUrl = new URL(".", location.href);
      article.querySelectorAll("a[href]").forEach((link) => {
        const href = link.getAttribute("href");
        if (!href) return;
        if (href.startsWith("#")) {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            document.getElementById(href.slice(1))?.scrollIntoView();
          });
          return;
        }
        const resolved = new URL(href, currentUrl);
        const relative = decodeURIComponent(resolved.pathname.slice(docsUrl.pathname.length));
        if (resolved.origin === location.origin &&
            state.pages.some((page) => page.path === relative)) {
          link.href = `#/${encodeURI(relative)}`;
        } else if (resolved.origin !== location.origin) {
          link.target = "_blank";
          link.rel = "noreferrer";
        }
      });

      toc.innerHTML = headings.length ? `
        <h2>In questa pagina</h2>
        ${headings.map((heading) => `
          <button type="button" class="level-${heading.tagName.slice(1)}"
            data-heading="${escapeHtml(heading.id)}">${escapeHtml(heading.textContent)}</button>
        `).join("")}
      ` : "";
      toc.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () =>
          document.getElementById(button.dataset.heading)?.scrollIntoView());
      });
    }

    async function renderPage(path) {
      state.currentPath = path;
      setActiveNavigation(path);
      closeMenu();
      searchResults.hidden = true;
      article.innerHTML = '<div class="status">Caricamento…</div>';
      try {
        const response = await fetch(path, { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        state.searchIndex.set(path, markdown);
        article.innerHTML = marked.parse(markdown);
        enhanceArticle(path);
        await mermaid.run({ querySelector: ".mermaid" });
        const title = article.querySelector("h1")?.textContent || "Documentazione";
        document.title = `${title} · Chigio Time`;
        scrollTo({ top: 0, behavior: "instant" });
        article.focus({ preventScroll: true });
      } catch (error) {
        article.innerHTML = `
          <div class="status">
            <div><strong>Pagina non disponibile</strong><br>
            ${escapeHtml(error.message)}<br><br>
            Avvia un server HTTP dalla cartella del progetto.</div>
          </div>`;
        toc.innerHTML = "";
      }
    }

    async function indexPages() {
      const queue = state.pages.filter((page) => !state.searchIndex.has(page.path));
      const workers = Array.from({ length: 6 }, async () => {
        while (queue.length) {
          const page = queue.shift();
          try {
            const response = await fetch(page.path);
            if (response.ok) state.searchIndex.set(page.path, await response.text());
          } catch (_) {
            // Search remains usable for the pages already loaded.
          }
        }
      });
      await Promise.all(workers);
    }

    function runSearch() {
      const query = normalizeText(search.value.trim());
      if (query.length < 2) {
        searchResults.hidden = true;
        return;
      }
      const tokens = query.split(/\s+/).filter(Boolean);
      const matches = state.pages.map((page) => {
        const markdown = state.searchIndex.get(page.path) || "";
        const haystack = normalizeText(`${page.title} ${page.description} ${markdown}`);
        const score = tokens.reduce((total, token) => {
          const titleHit = normalizeText(page.title).includes(token) ? 8 : 0;
          const bodyHit = haystack.includes(token) ? 1 : -20;
          return total + titleHit + bodyHit;
        }, 0);
        const plain = markdown
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/[#>*_`|[\]()!-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        const firstToken = tokens[0];
        const index = normalizeText(plain).indexOf(firstToken);
        const start = Math.max(0, index - 55);
        return { ...page, score, snippet: plain.slice(start, start + 170) };
      }).filter((page) => page.score >= tokens.length)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

      searchResults.innerHTML = matches.length
        ? matches.map((page) => `
          <button class="result" type="button" role="option"
            data-path="${escapeHtml(page.path)}">
            <strong>${escapeHtml(page.title)}</strong>
            <span>${escapeHtml(page.snippet || page.description)}</span>
          </button>
        `).join("")
        : '<div class="result"><strong>Nessun risultato</strong><span>Prova termini più generali.</span></div>';
      searchResults.hidden = false;
    }

    search.addEventListener("input", runSearch);
    search.addEventListener("focus", runSearch);
    searchResults.addEventListener("click", (event) => {
      const result = event.target.closest("[data-path]");
      if (!result) return;
      location.hash = `#/${encodeURI(result.dataset.path)}`;
      search.value = "";
      searchResults.hidden = true;
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".search-wrap")) searchResults.hidden = true;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
        event.preventDefault();
        search.focus();
      }
      if (event.key === "Escape") {
        searchResults.hidden = true;
        closeMenu();
      }
    });

    menuButton.addEventListener("click", () => {
      const open = document.body.classList.toggle("menu-open");
      menuButton.setAttribute("aria-expanded", String(open));
    });
    document.getElementById("backdrop").addEventListener("click", closeMenu);
    window.addEventListener("hashchange", () => renderPage(routePath()));

    async function start() {
      try {
        const response = await fetch("navigation.json", { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.manifest = await response.json();
        state.pages = state.manifest.sections.flatMap((section) =>
          section.items.map((item) => ({ ...item, section: section.title })));
        renderNavigation();
        await renderPage(routePath());
        void indexPages();
      } catch (error) {
        article.innerHTML = `<div class="status"><div>
          <strong>Impossibile caricare l'indice</strong><br>
          ${escapeHtml(error.message)}
        </div></div>`;
      }
    }

    mermaid.initialize({
      startOnLoad: false,
      theme: "neutral",
      securityLevel: "loose",
      fontFamily: "Inter, system-ui, sans-serif"
    });
    start();
  </script>
</body>
</html>
