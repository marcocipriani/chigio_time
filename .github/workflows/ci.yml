name: CI

# Esegue automaticamente il gate pre-rilascio descritto in
# docs/processi/testing.md: analisi + test Flutter, test Node di functions/ e
# scripts/, syntax check delle Cloud Functions e verifica che i file generati
# committati siano allineati alle sorgenti.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # Il dominio è il giorno civile italiano: i calcoli su date vanno
      # verificati anche nel fuso reale, dove i passaggi di ora legale
      # rompono l'aritmetica assoluta sulle DateTime.
      - name: flutter test (TZ Europe/Rome)
        env:
          TZ: Europe/Rome
        run: flutter test test/core/services/italian_holidays_test.dart

  codegen:
    name: Generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # I file *.g.dart sono versionati: se il build_runner produce un diff,
      # qualcuno ha modificato una sorgente senza rigenerare.
      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::File generati non allineati: esegui 'dart run build_runner build --delete-conflicting-outputs' e committa il risultato."
            exit 1
          fi

  node:
    name: Functions + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Non ha dipendenze: gira prima di qualsiasi install.
      - name: Test service worker Web
        run: node --test test/platform/firebase_messaging_sw_test.js

      - name: Install functions deps
        run: npm ci --prefix functions

      - name: Syntax check functions
        run: |
          node --check functions/index.js
          node --check functions/notification_logic.js
          node --check functions/notification_runtime.js

      - name: Test functions
        run: npm test --prefix functions

      - name: Install scripts deps
        run: npm ci --prefix scripts

      - name: Test scripts
        run: npm test --prefix scripts
